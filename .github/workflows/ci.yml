name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        esphome: ["2026.10.0"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - name: Install test dependencies
        run: python -m pip install esphome==${{ matrix.esphome }} pytest==9.0.3 ruff==0.15.21
      - name: Fetch the GMF manager pinned by the component
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          source = Path('esphome/components/esp_afe/__init__.py')
          dependencies = [node for node in ast.walk(ast.parse(source.read_text()))
                          if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
                          and node.func.id == 'add_idf_component'
                          and any(arg.arg == 'repo' for arg in node.keywords)]
          dependency = next(node for node in dependencies
                            if any(arg.arg == 'name' and ast.literal_eval(arg.value) == 'espressif/gmf_ai_audio'
                                   for arg in node.keywords))
          values = {arg.arg: ast.literal_eval(arg.value) for arg in dependency.keywords}
          assert re.fullmatch(r'[0-9a-f]{40}', values['ref']), 'GMF tests require an immutable firmware pin'
          checkout = Path('.test-deps/esp-gmf').resolve()
          checkout.mkdir(parents=True)
          subprocess.run(['git', 'init', str(checkout)], check=True)
          subprocess.run(['git', '-C', str(checkout), 'fetch', '--depth=1', values['repo'], values['ref']], check=True)
          subprocess.run(['git', '-C', str(checkout), 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          manager = checkout / values['path'] / 'src/esp_gmf_afe_manager.c'
          digest = hashlib.sha256(manager.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'GMF_AFE_MANAGER_SOURCE={manager}\n')
          Path('test-results').mkdir(exist_ok=True)
          Path('test-results/native-dependencies.json').write_text(json.dumps({
              'gmf': {'repository': values['repo'], 'revision': values['ref'], 'manager_sha256': digest}
          }, indent=2) + '\n')
          PY
      - name: Lint component and tests
        run: python -m ruff check esphome tests tools
      - name: Run contract tests
        run: python -m pytest -q -ra --junitxml=test-results/native.xml
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audio-native-${{ matrix.esphome }}
          path: |
            test-results/native.xml
            test-results/native-dependencies.json
          if-no-files-found: error

  optional-audio-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example:
          - 04-dual-mic-downmix
          - 05-stereo-i2s-downmix
          - 06-dual-mic-afe-bss
          - 07-stereo-i2s-afe-bss
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - name: Install official ESPHome
        run: python -m pip install esphome==2026.10.0
      - name: Compile the selected microphone delivery example
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          mkdir -p test-results
          printf 'wifi_ssid: test-network\nwifi_password: test-password\n' > examples/secrets.yaml
          set -o pipefail
          python -m esphome compile "examples/${EXAMPLE}.yaml" 2>&1 | tee test-results/optional-audio.log
      - name: Preserve firmware build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optional-audio-firmware-${{ matrix.example }}
          path: test-results/optional-audio.log
          if-no-files-found: error
