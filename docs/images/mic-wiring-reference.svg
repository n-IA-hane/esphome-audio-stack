<svg xmlns="http://www.w3.org/2000/svg" width="620" height="735" viewBox="0 0 620 735" role="img" aria-labelledby="title description">
  <title id="title">Playback reference is a separate signal</title>
  <desc id="description">Software reference branches from the playback path. Hardware reference comes from verified codec feedback or an ADC slot, never from another microphone.</desc>
  <defs>
    <marker id="arrow-audio" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-reference" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b45309" />
    </marker>
    <marker id="arrow-clock" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#596579" />
    </marker>
  </defs>
  <rect width="620" height="735" rx="14" fill="#f6f8fa" />
  <text x="310" y="35" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">Playback reference is a separate signal</text>
  <rect x="25" y="75" width="570" height="315" rx="12" fill="#ffffff" stroke="#c6d0db" stroke-width="2" />
  <text x="310" y="112" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Software playback reference</text>
  <rect x="45" y="165" width="220" height="75" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="155.0" y="202.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Playback path</text>
  <rect x="375" y="165" width="200" height="75" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="475.0" y="187.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">I2S TX</text>
  <text x="475.0" y="218.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Speaker</text>
  <path d="M265,202.5 L375,202.5" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <rect x="45" y="315" width="530" height="55" rx="10" fill="#dcf5e8" stroke="#a9b8c9" stroke-width="2" />
  <text x="310.0" y="342.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">AEC / AFE</text>
  <path d="M155,240 L155,315" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-reference)" />
  <text x="365" y="279" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Playback reference</text>
  <rect x="25" y="440" width="570" height="265" rx="12" fill="#ffffff" stroke="#c6d0db" stroke-width="2" />
  <text x="310" y="480" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Hardware playback reference</text>
  <rect x="45" y="550" width="235" height="105" rx="10" fill="#fff1cb" stroke="#a9b8c9" stroke-width="2" />
  <text x="162.5" y="587.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Codec feedback</text>
  <text x="162.5" y="618.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">or wired ADC slot</text>
  <rect x="365" y="550" width="210" height="105" rx="10" fill="#dcf5e8" stroke="#a9b8c9" stroke-width="2" />
  <text x="470.0" y="602.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">AEC / AFE</text>
  <path d="M280,602.5 L365,602.5" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-reference)" />
</svg>
