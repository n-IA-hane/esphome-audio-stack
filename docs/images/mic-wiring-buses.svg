<svg xmlns="http://www.w3.org/2000/svg" width="620" height="760" viewBox="0 0 620 760" role="img" aria-labelledby="title description">
  <title id="title">One audio owner, shared or split buses</title>
  <desc id="description">A shared bus uses one RX/TX I2S port and shared clocks. Split buses use distinct capture and playback ports, not two mic receivers.</desc>
  <defs>
    <marker id="arrow-audio" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-reference" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b45309" />
    </marker>
    <marker id="arrow-clock" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#596579" />
    </marker>
  </defs>
  <rect width="620" height="760" rx="14" fill="#f6f8fa" />
  <text x="310" y="35" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">One audio owner, shared or split buses</text>
  <rect x="25" y="75" width="570" height="310" rx="12" fill="#ffffff" stroke="#c6d0db" stroke-width="2" />
  <text x="310" y="110" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">One shared I2S bus</text>
  <rect x="50" y="160" width="170" height="70" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="135.0" y="195.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Mic(s)</text>
  <rect x="50" y="260" width="170" height="70" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="135.0" y="295.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Speaker</text>
  <rect x="335" y="160" width="230" height="170" rx="10" fill="#dcf5e8" stroke="#a9b8c9" stroke-width="2" />
  <text x="450.0" y="229.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">One I2S port</text>
  <text x="450.0" y="260.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">RX + TX</text>
  <path d="M220,195 L335,195" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <path d="M335,295 L220,295" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <text x="310" y="360" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Shared BCLK + WS</text>
  <rect x="25" y="415" width="570" height="310" rx="12" fill="#ffffff" stroke="#c6d0db" stroke-width="2" />
  <text x="310" y="450" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Separate RX and TX buses</text>
  <rect x="50" y="500" width="170" height="70" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="135.0" y="535.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Mic(s)</text>
  <rect x="50" y="600" width="170" height="70" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="135.0" y="635.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Speaker</text>
  <rect x="335" y="500" width="230" height="70" rx="10" fill="#dcf5e8" stroke="#a9b8c9" stroke-width="2" />
  <text x="450.0" y="535.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">I2S port 0 RX</text>
  <rect x="335" y="600" width="230" height="70" rx="10" fill="#dcf5e8" stroke="#a9b8c9" stroke-width="2" />
  <text x="450.0" y="635.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">I2S port 1 TX</text>
  <path d="M220,535 L335,535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <path d="M335,635 L220,635" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <text x="310" y="700" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Separate BCLK + WS</text>
</svg>
