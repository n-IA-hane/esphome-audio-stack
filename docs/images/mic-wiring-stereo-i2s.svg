<svg xmlns="http://www.w3.org/2000/svg" width="620" height="685" viewBox="0 0 620 685" role="img" aria-labelledby="title description">
  <title id="title">Two microphones, one shared DATA line</title>
  <desc id="description">Compatible microphones share BCLK, WS and DATA. One transmits in Left and the other in Right, releasing the inactive slot.</desc>
  <defs>
    <marker id="arrow-audio" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-reference" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b45309" />
    </marker>
    <marker id="arrow-clock" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#596579" />
    </marker>
  </defs>
  <rect width="620" height="685" rx="14" fill="#f6f8fa" />
  <text x="310" y="35" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">Two microphones, one shared DATA line</text>
  <rect x="190" y="70" width="240" height="80" rx="10" fill="#edf0f5" stroke="#a9b8c9" stroke-width="2" />
  <text x="310.0" y="110.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">ESP BCLK + WS</text>
  <rect x="40" y="245" width="240" height="80" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="160.0" y="269.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Mic A</text>
  <text x="160.0" y="300.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">SEL = Left</text>
  <rect x="340" y="245" width="240" height="80" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="460.0" y="269.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Mic B</text>
  <text x="460.0" y="300.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">SEL = Right</text>
  <path d="M310,150 L310,195" fill="none" stroke="#596579" stroke-width="3" stroke-linejoin="round" />
  <path d="M310,195 L160,195 L160,245" fill="none" stroke="#596579" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-clock)" />
  <path d="M310,195 L460,195 L460,245" fill="none" stroke="#596579" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-clock)" />
  <circle cx="310" cy="195" r="4" fill="#596579" />
  <text x="310" y="220" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle">Shared clocks</text>
  <path d="M160,325 L160,390 L310,390" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" />
  <path d="M460,325 L460,390 L310,390" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" />
  <circle cx="310" cy="390" r="4" fill="#2563eb" />
  <rect x="190" y="445" width="240" height="70" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="310.0" y="480.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">ESP DIN</text>
  <path d="M310,390 L310,445" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <rect x="40" y="575" width="270" height="80" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="175.0" y="599.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Left slot</text>
  <text x="175.0" y="630.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Mic A</text>
  <rect x="310" y="575" width="270" height="80" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="445.0" y="599.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Right slot</text>
  <text x="445.0" y="630.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Mic B</text>
  <path d="M310,515 L310,575" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
</svg>
