<svg xmlns="http://www.w3.org/2000/svg" width="620" height="860" viewBox="0 0 620 860" role="img" aria-labelledby="title description">
  <title id="title">Capture once, choose microphone delivery</title>
  <desc id="description">Audio Stack owns capture. Passthrough retains independent channels; averaging produces mono before processing.</desc>
  <defs>
    <marker id="arrow-audio" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-reference" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b45309" />
    </marker>
    <marker id="arrow-clock" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#596579" />
    </marker>
  </defs>
  <rect width="620" height="860" rx="14" fill="#f6f8fa" />
  <text x="310" y="35" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">Capture once, choose microphone delivery</text>
  <rect x="140" y="70" width="340" height="70" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="310.0" y="105.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Physical microphone(s)</text>
  <rect x="40" y="195" width="540" height="85" rx="10" fill="#dcf5e8" stroke="#a9b8c9" stroke-width="2" />
  <text x="310.0" y="222.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Audio Stack</text>
  <text x="310.0" y="253.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Capture + channel selection</text>
  <path d="M310,140 L310,195" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <rect x="40" y="340" width="240" height="90" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="160.0" y="369.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Passthrough</text>
  <text x="160.0" y="400.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">1 or 2 channels</text>
  <rect x="340" y="340" width="240" height="90" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="460.0" y="369.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Average</text>
  <text x="460.0" y="400.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">One mono channel</text>
  <path d="M160,280 L160,340" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <path d="M460,280 L460,340" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <rect x="40" y="500" width="540" height="90" rx="10" fill="#dcf5e8" stroke="#a9b8c9" stroke-width="2" />
  <text x="310.0" y="545.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">AEC / AFE / no DSP</text>
  <path d="M160,430 L160,500" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <path d="M460,430 L460,500" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <rect x="140" y="650" width="340" height="70" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="310.0" y="685.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Public mono microphone</text>
  <path d="M310,590 L310,650" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <rect x="40" y="775" width="540" height="60" rx="10" fill="#ffffff" stroke="#a9b8c9" stroke-width="2" />
  <text x="310.0" y="805.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">MWW  |  Assist  |  VoIP</text>
  <path d="M310,720 L310,775" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
</svg>
