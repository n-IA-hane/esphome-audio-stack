<svg xmlns="http://www.w3.org/2000/svg" width="620" height="520" viewBox="0 0 620 520" role="img" aria-labelledby="title description">
  <title id="title">ES8311: one mic plus DAC reference</title>
  <desc id="description">The left ES8311 feedback slot is the microphone ADC and the right is DAC playback reference. These are not two microphones.</desc>
  <defs>
    <marker id="arrow-audio" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-reference" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b45309" />
    </marker>
    <marker id="arrow-clock" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#596579" />
    </marker>
  </defs>
  <rect width="620" height="520" rx="14" fill="#f6f8fa" />
  <text x="310" y="35" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">ES8311: one mic plus DAC reference</text>
  <rect x="40" y="110" width="270" height="100" rx="10" fill="#e5efff" stroke="#a9b8c9" stroke-width="2" />
  <text x="175.0" y="144.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Left slot</text>
  <text x="175.0" y="175.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Microphone ADC</text>
  <rect x="310" y="110" width="270" height="100" rx="10" fill="#fff1cb" stroke="#a9b8c9" stroke-width="2" />
  <text x="445.0" y="144.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Right slot</text>
  <text x="445.0" y="175.5" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">DAC reference</text>
  <rect x="40" y="345" width="540" height="90" rx="10" fill="#dcf5e8" stroke="#a9b8c9" stroke-width="2" />
  <text x="310.0" y="390.0" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Mono AEC or mono AFE</text>
  <path d="M175,210 L175,345" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-audio)" />
  <path d="M445,210 L445,345" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-reference)" />
  <text x="310" y="485" fill="#172335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">The reference is not a second microphone.</text>
</svg>
