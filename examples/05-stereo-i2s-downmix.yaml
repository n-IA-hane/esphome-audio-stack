# Two compatible I2S microphones, no input codec. Illustrative GPIOs only.
# Share BCLK, WS and SD; select Left on one mic and Right on the other.
# Confirm the microphones release SD outside their selected slot.
# Keep capture wiring independent of the chosen processor and mic_mix policy.
# For separate Left/Right channels with AFE/SE-BSS on the same wiring, see
# 07-stereo-i2s-afe-bss.yaml.
esphome:
  name: stereo-mic-downmix
  min_version: 2026.10.0
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf
psram:
  mode: octal
  speed: 80MHz
logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
# For unpublished changes, override this source only in a private local YAML.
external_components:
  - source: github://n-IA-hane/esphome-audio-stack@main
    components: [esp_audio_stack, esp_aec]
esp_audio_stack:
  id: audio_bus
  i2s_bclk_pin: GPIO5
  i2s_lrclk_pin: GPIO6
  i2s_din_pin: GPIO4
  i2s_dout_pin: GPIO7
  sample_rate: 48000
  output_sample_rate: 16000
  slot_bit_width: 32
  rx_slot_mode: stereo
  rx_mic_slots: [left, right]
  mic_mix: average
  processor_id: processor
  aec_reference: previous_frame
  correct_dc_offset: true
  buffers_in_psram: true
esp_aec:
  id: processor
  sample_rate: 16000
  mode: fd_low_cost
microphone:
  - platform: esp_audio_stack
    id: processed_mic
    esp_audio_stack_id: audio_bus
speaker:
  - platform: esp_audio_stack
    id: output
    esp_audio_stack_id: audio_bus
    sample_rate: 48000
    bits_per_sample: 16
