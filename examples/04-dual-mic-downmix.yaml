# Two physical microphones averaged by Audio Stack before mono AEC.
# These pins/slots are illustrative. Check your board before flashing.
# For separate microphone channels with AFE/SE-BSS on the same wiring, see
# 06-dual-mic-afe-bss.yaml.
esphome:
  name: audio-stack-downmix
  min_version: 2026.10.0
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
psram:
  mode: octal
  speed: 80MHz
logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
external_components:
  - source: ../esphome/components
    components: [esp_audio_stack, esp_aec, esp_audio_capture]
i2c:
  sda: GPIO11
  scl: GPIO10
  frequency: 400kHz
esp_aec:
  id: processor
  sample_rate: 16000
  mode: fd_low_cost
  filter_length: 4
esp_audio_stack:
  id: audio_bus
  i2s_mclk_pin: GPIO12
  i2s_bclk_pin: GPIO13
  i2s_lrclk_pin: GPIO14
  i2s_din_pin: GPIO15
  i2s_dout_pin: GPIO16
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: processor
  mic_mix: average
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: [0, 2]
  tdm_ref_slot: 1
  codec:
    input:
      type: es7210
      mic_selected: 15
      gain_db: 0
      ref_channel: 2
      ref_gain_db: 24
    output:
      type: es8311
microphone:
  - platform: esp_audio_stack
    id: mic
    esp_audio_stack_id: audio_bus
speaker:
  - platform: esp_audio_stack
    id: output
    esp_audio_stack_id: audio_bus
number:
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_bus
    input_pga:
      name: Microphone PGA
    reference_pga:
      name: Reference PGA
# Optional diagnostics. Remove this component and its two buttons when unused.
# No queue, task or connection exists until start is pressed.
esp_audio_capture:
  id: capture
  esp_audio_stack_id: audio_bus
  microphone_id: mic
  address: 192.0.2.10
  duration: 15s
  buffer_size: 65536
  points: [raw_mic, reference, processor_input, processor_output, output]
button:
  - platform: template
    name: Start PCM capture
    on_press:
      - esp_audio_capture.start: capture
  - platform: template
    name: Stop PCM capture
    on_press:
      - esp_audio_capture.stop: capture
